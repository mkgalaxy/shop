{% load static %}
<!-- پاپ‌آپ ویرایش پروفایل -->
<div id="profile-modal" class="fixed inset-0 z-[100] flex items-center justify-center bg-black/60 backdrop-blur-sm hidden transition-opacity duration-300">
    <div class="relative w-full max-w-lg mx-4">

        <div class="relative w-full bg-surface-container-lowest border border-surface-container/60 rounded-2xl shadow-2xl p-8">

            <!-- دکمه بستن پاپ‌آپ -->
            <button type="button" onclick="closeProfileModal()" class="absolute top-4 left-4 text-on-surface-variant hover:text-primary transition-colors cursor-pointer z-20">
                <span class="material-symbols-outlined">close</span>
            </button>

            <div class="flex items-center gap-3 mb-6 pb-4 border-b border-surface-container/60">
                <span class="material-symbols-outlined text-3xl text-primary">edit_square</span>
                <div>
                    <h2 class="text-xl font-black text-on-surface">ویرایش پروفایل کاربری</h2>
                    <p class="text-xs text-on-surface-variant font-medium">اطلاعات حساب خود را به‌روزرسانی کنید</p>
                </div>
            </div>

            <form method="POST" action="{% url 'edit_profile' %}" class="space-y-4">
                {% csrf_token %}

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-bold text-on-surface mb-1.5">نام</label>
                        <input type="text" name="first_name" value="{{ user.first_name }}" class="w-full bg-surface-container-low border border-surface-container rounded-xl px-3.5 py-2.5 text-xs text-on-surface outline-none focus:border-primary font-medium"/>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-on-surface mb-1.5">نام خانوادگی</label>
                        <input type="text" name="last_name" value="{{ user.last_name }}" class="w-full bg-surface-container-low border border-surface-container rounded-xl px-3.5 py-2.5 text-xs text-on-surface outline-none focus:border-primary font-medium"/>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-on-surface mb-1.5">نام کاربری (غیرقابل تغییر)</label>
                    <input type="text" value="{{ user.username }}" disabled class="w-full bg-surface-container-high/40 border border-surface-container rounded-xl px-3.5 py-2.5 text-xs text-on-surface-variant cursor-not-allowed font-medium"/>
                </div>

                <div>
                    <label class="block text-xs font-bold text-on-surface mb-1.5">شماره تلفن (غیرقابل تغییر)</label>
                    <input type="text" value="{{ user.phone_number }}" disabled class="w-full bg-surface-container-high/40 border border-surface-container rounded-xl px-3.5 py-2.5 text-xs text-on-surface-variant cursor-not-allowed font-medium"/>
                </div>

                <div>
                    <label class="block text-xs font-bold text-on-surface mb-1.5">ایمیل</label>
                    <input type="email" name="email" value="{{ user.email }}" placeholder="example@mail.com" class="w-full bg-surface-container-low border border-surface-container rounded-xl px-3.5 py-2.5 text-xs text-on-surface outline-none focus:border-primary font-medium"/>
                </div>

                <hr class="my-4 border-surface-container/60"/>

                <div>
                    <label class="block text-xs font-bold text-on-surface mb-1.5">رمز عبور جدید (در صورت تمایل)</label>
                    <input type="password" name="new_password" placeholder="اگر قصد تغییر رمز ندارید خالی بگذارید" class="w-full bg-surface-container-low border border-surface-container rounded-xl px-3.5 py-2.5 text-xs text-on-surface outline-none focus:border-primary font-medium"/>
                </div>

                <div class="flex items-center justify-end gap-3 pt-2">
                    <button type="button" onclick="closeProfileModal()" class="px-4 py-2.5 rounded-xl border border-surface-container text-xs font-bold text-on-surface-variant hover:bg-surface-container-low transition-colors cursor-pointer">انصراف</button>
                    <button type="submit" class="bg-primary hover:bg-primary-container text-on-primary px-6 py-2.5 rounded-xl text-xs font-extrabold shadow-md transition-colors cursor-pointer">
                        ذخیره تغییرات
                    </button>
                </div>
            </form>

        </div>
    </div>
</div>

<script>
    function openProfileModal() {
        document.getElementById('profile-modal').classList.remove('hidden');
    }
    function closeProfileModal() {
        document.getElementById('profile-modal').classList.add('hidden');
    }
    document.getElementById('profile-modal').addEventListener('click', function(e) {
        if (e.target === this) {
            closeProfileModal();
        }
    });
</script>
